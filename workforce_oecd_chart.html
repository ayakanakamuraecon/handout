<!-- 年齢階級別女性労働力率の国際比較（折れ線グラフ）。データ出典：労働政策研究・研修機構『データブック国際労働比較2024』第2-11-2表（女、2022年） -->
<div class="viz-root workforce-chart">
<style>
.workforce-chart{
  --surface-1:      #fcfcfb;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid-line:      #e1e0d9;
  --axis-line:      #c3c2b7;
  font-family: "Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif;
  color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--grid-line);
  border-radius: 4px;
  padding: 16px 18px 10px;
  margin: 20px 0 10px;
  position: relative;
}
.workforce-chart svg{
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}
.workforce-chart .wf-line{
  fill: none;
  stroke-width: 3px;
  transition: opacity .15s, stroke-width .15s;
}
.workforce-chart .wf-hit{
  fill: none;
  stroke: transparent;
  stroke-width: 16px;
  cursor: pointer;
}
.workforce-chart .wf-dot{
  transition: opacity .15s;
}
.workforce-chart .wf-label{
  font-size: 17px;
  fill: var(--text-secondary);
  transition: opacity .15s, font-weight .15s;
}
.workforce-chart .wf-leader{
  stroke: var(--text-muted);
  stroke-width: 1px;
  stroke-dasharray: 2 2;
}
.workforce-chart .wf-axis-text{
  font-size: 18px;
  fill: var(--text-muted);
}
.workforce-chart .wf-grid{
  stroke: var(--grid-line);
  stroke-width: 1px;
}
.workforce-chart .wf-axis{
  stroke: var(--axis-line);
  stroke-width: 1px;
}
.workforce-chart .wf-tooltip{
  position: absolute;
  pointer-events: none;
  background: #fff;
  border: 1px solid var(--grid-line);
  border-radius: 3px;
  padding: 8px 12px;
  font-size: .95rem;
  line-height: 1.5;
  box-shadow: 0 2px 6px rgba(11,11,11,.12);
  display: none;
  z-index: 5;
  white-space: nowrap;
}
.workforce-chart .wf-tooltip .wf-tt-name{ font-weight: 700; }
.workforce-chart .wf-caption{
  font-size: .78rem;
  color: var(--text-muted);
  text-align: right;
  margin-top: 2px;
}
.workforce-chart details{
  margin-top: 10px;
  font-size: .85rem;
}
.workforce-chart table{
  width: 100%;
  border-collapse: collapse;
  font-size: .78rem;
  margin-top: 6px;
}
.workforce-chart th, .workforce-chart td{
  border: 1px solid var(--grid-line);
  padding: 3px 6px;
  text-align: right;
}
.workforce-chart th:first-child, .workforce-chart td:first-child{
  text-align: left;
}
</style>

<svg id="wf-svg" viewBox="0 0 860 560" role="img" aria-label="年齢階級別女性労働力率の国際比較（2022年）折れ線グラフ"></svg>

<div class="wf-caption">出典：労働政策研究・研修機構『データブック国際労働比較2024』第2-11-2表（女、2022年）のデータをもとに筆者作成</div>

<details>
<summary>データを表で見る</summary>
<div id="wf-table"></div>
</details>

</div>

<script>
(function(){
  const ages = ["15-19","20-24","25-29","30-34","35-39","40-44","45-49","50-54","55-59","60-64","65+"];

  // 日本は本文全体で繰り返し焦点となる国のため単独の赤（暖色）。
  // 他5か国はdatavizスキルの検証済みカテゴリカルパレット（赤を除く7色のうち5色）を固定順で割り当て。
  const data = [
    {name:"日本",         color:"#e34948", values:[20.8,75.6,87.7,80.6,78.9,81.5,81.9,80.7,75.8,64.0,18.4]},
    {name:"アメリカ",     color:"#2a78d6", values:[37.2,68.7,78.2,77.1,76.0,76.5,76.2,74.3,67.6,51.7,15.5]},
    {name:"フランス",     color:"#eda100", values:[16.6,64.5,83.2,82.7,83.4,85.4,85.8,85.0,78.1,38.7,3.0]},
    {name:"イタリア",     color:"#e87ba4", values:[5.5,37.3,63.9,67.8,69.4,71.4,70.7,66.9,58.3,35.2,2.9]},
    {name:"スウェーデン", color:"#008300", values:[45.1,68.9,83.2,87.7,89.4,90.8,91.6,90.8,86.0,70.8,15.9]},
    {name:"韓国",         color:"#4a3aa7", values:[10.1,53.8,78.2,71.0,62.1,65.0,67.6,70.0,65.6,53.7,29.0]}
  ];

  const margin = {left:44, right:150, top:20, bottom:44};
  const width = 860, height = 560;
  const plotW = width - margin.left - margin.right;
  const plotH = height - margin.top - margin.bottom;
  const yMin = 0, yMax = 100;

  function xScale(i){
    return margin.left + i / (ages.length - 1) * plotW;
  }
  function yScale(v){
    return margin.top + (yMax - v) / (yMax - yMin) * plotH;
  }

  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("wf-svg");
  function el(tag, attrs){
    const e = document.createElementNS(svgns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // グリッド・軸
  for (let v = yMin; v <= yMax; v += 20){
    const y = yScale(v);
    svg.appendChild(el("line", {class:"wf-grid", x1:margin.left, x2:width-margin.right, y1:y, y2:y}));
    const t = el("text", {class:"wf-axis-text", x:margin.left-10, y:y+5, "text-anchor":"end"});
    t.textContent = v;
    svg.appendChild(t);
  }
  svg.appendChild(el("line", {class:"wf-axis", x1:margin.left, x2:margin.left, y1:margin.top, y2:height-margin.bottom}));
  ages.forEach((a, i) => {
    const x = xScale(i);
    const t = el("text", {class:"wf-axis-text", x:x, y:height-margin.bottom+24, "text-anchor":"middle"});
    t.textContent = a;
    svg.appendChild(t);
  });
  svg.appendChild(el("line", {class:"wf-axis", x1:margin.left, x2:width-margin.right, y1:height-margin.bottom, y2:height-margin.bottom}));

  const lineEls = [], hitEls = [], labelEls = [];

  data.forEach((d, idx) => {
    let path = "";
    d.values.forEach((v, i) => {
      path += `${i === 0 ? "M" : "L"}${xScale(i).toFixed(1)},${yScale(v).toFixed(1)} `;
    });

    const line = el("path", {class:"wf-line", d:path, stroke:d.color});
    svg.appendChild(line);
    lineEls.push(line);

    d.values.forEach((v, i) => {
      svg.appendChild(el("circle", {class:"wf-dot", cx:xScale(i), cy:yScale(v), r:3.6, fill:d.color, "data-idx":idx}));
    });

    const hit = el("path", {class:"wf-hit", d:path, "data-idx":idx});
    svg.appendChild(hit);
    hitEls.push(hit);
  });

  // ラベル配置：各線について「他の線からもっとも離れている点」を候補に、
  // 既に置いたラベルとも・どの線の経路とも重ならない位置（上下・左右にずらす）を貪欲法で探す。
  // 決まった位置が元の点からずれる場合は点線でつなぐ。
  const charW = 15.5, labelH = 19;
  const placedBoxes = [];
  const xPositions = ages.map((a, i) => xScale(i));
  const offsets = [
    {dx:0, dy:-18}, {dx:0, dy:18},
    {dx:24, dy:-10}, {dx:24, dy:10}, {dx:-24, dy:-10}, {dx:-24, dy:10},
    {dx:0, dy:-34}, {dx:0, dy:34},
    {dx:36, dy:-24}, {dx:36, dy:24}, {dx:-36, dy:-24}, {dx:-36, dy:24},
    {dx:0, dy:-50}, {dx:0, dy:50},
    {dx:50, dy:-10}, {dx:50, dy:10}, {dx:-50, dy:-10}, {dx:-50, dy:10}
  ];
  function boxesOverlap(a, b){
    return !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
  }
  // ボックスの水平範囲内で各系列の経路をサンプリングし、垂直範囲と重なるかを調べる
  const lineMargin = 5;
  function boxHitsAnyLine(box){
    const x0 = box.x - lineMargin, x1 = box.x + box.w + lineMargin;
    const y0 = box.y - lineMargin, y1 = box.y + box.h + lineMargin;
    for (const d2 of data){
      for (let i = 0; i < xPositions.length - 1; i++){
        const xa = xPositions[i], xb = xPositions[i+1];
        if (xb < x0 || xa > x1) continue;
        const ya = yScale(d2.values[i]), yb = yScale(d2.values[i+1]);
        // 区間 [xa,xb] と [x0,x1] の共通範囲でy補間値をサンプリング
        const sxLo = Math.max(xa, x0), sxHi = Math.min(xb, x1);
        for (const sx of [sxLo, (sxLo+sxHi)/2, sxHi]){
          const t = xb === xa ? 0 : (sx - xa) / (xb - xa);
          const sy = ya + t * (yb - ya);
          if (sy >= y0 && sy <= y1) return true;
        }
      }
    }
    return false;
  }

  const dataByName = {};
  data.forEach(d => dataByName[d.name] = d);
  const chosenByName = {};

  function nearestOwnPoint(d, tx, ty){
    let best = null, bestDist = Infinity;
    d.values.forEach((v, i) => {
      const x = xScale(i), y = yScale(v);
      const dist = Math.hypot(x - tx, y - ty);
      if (dist < bestDist){ bestDist = dist; best = {x, y}; }
    });
    return best;
  }

  function drawLabel(d, chosen){
    placedBoxes.push(chosen.box);
    chosenByName[d.name] = chosen;
    if (Math.hypot(chosen.lx - chosen.px, chosen.ly - chosen.py) > 6){
      svg.appendChild(el("line", {class:"wf-leader", x1:chosen.px, y1:chosen.py, x2:chosen.lx, y2:chosen.ly}));
    }
    const label = el("text", {
      class:"wf-label", x:chosen.lx, y:chosen.ly + 5,
      "text-anchor": chosen.dx > 0 ? "start" : (chosen.dx < 0 ? "end" : "middle")
    });
    label.textContent = d.name;
    label.style.fill = d.color;
    svg.appendChild(label);
    labelEls.push(label);
  }

  function autoPlace(d, idx, nudge){
    const candidates = d.values.map((v, xi) => {
      let minDist = Infinity;
      data.forEach((d2, si2) => {
        if (si2 === idx) return;
        minDist = Math.min(minDist, Math.abs(v - d2.values[xi]));
      });
      return {xi, x: xScale(xi), y: yScale(v), clearance: minDist};
    }).sort((a, b) => b.clearance - a.clearance);

    const w = d.name.length * charW;
    let chosen = null;
    for (const c of candidates){
      for (const o of offsets){
        const lx = c.x + o.dx, ly = c.y + o.dy;
        const box = {x: lx - (o.dx > 0 ? 2 : (o.dx < 0 ? w + 2 : w/2)), y: ly - labelH/2, w, h: labelH};
        if (box.y < margin.top || box.y + box.h > height - margin.bottom) continue;
        if (placedBoxes.some(p => boxesOverlap(box, p))) continue;
        if (boxHitsAnyLine(box)) continue;
        chosen = {px: c.x, py: c.y, lx, ly, dx: o.dx, box};
        break;
      }
      if (chosen) break;
    }
    if (!chosen){
      const c = candidates[0];
      chosen = {px: c.x, py: c.y, lx: c.x, ly: c.y - 16, dx: 0, box: {x: c.x - w/2, y: c.y - 16 - labelH/2, w, h: labelH}};
    }
    if (nudge){
      chosen.lx += nudge.dx || 0;
      chosen.ly += nudge.dy || 0;
      chosen.box = {x: chosen.lx - (chosen.dx > 0 ? 2 : (chosen.dx < 0 ? w + 2 : w/2)), y: chosen.ly - labelH/2, w, h: labelH};
    }
    drawLabel(d, chosen);
  }

  function manualPlace(d, lx, ly, dx){
    const w = d.name.length * charW;
    const box = {x: lx - (dx > 0 ? 2 : (dx < 0 ? w + 2 : w/2)), y: ly - labelH/2, w, h: labelH};
    const anchorPt = nearestOwnPoint(d, lx, ly);
    drawLabel(d, {px: anchorPt.x, py: anchorPt.y, lx, ly, dx, box});
  }

  // 自動配置（クリアランス最大点＋衝突回避）：フランスのみ
  // フランスは自動位置から1文字分上にユーザー指定で微調整
  autoPlace(dataByName["フランス"], data.indexOf(dataByName["フランス"]), {dy: -charW});

  // 手動配置（ユーザー指定の位置に固定。データが変わっても位置がずれないよう自動配置から外している）
  manualPlace(dataByName["日本"], (xScale(1) + xScale(2)) / 2, yScale(90), 0); // 20-24歳と25-29歳の間くらい・90%
  manualPlace(dataByName["韓国"], xScale(4), yScale(40), 0); // 35-39歳・40%あたり
  manualPlace(dataByName["イタリア"], xScale(1) + 2 * charW, yScale(37.3) - 16, 1); // 自然な位置(20-24歳)から2文字右
  manualPlace(dataByName["スウェーデン"], (xScale(9) + xScale(10)) / 2 + 2 * charW, yScale(70), 0); // 60-64歳と65+の間くらい・70%から2文字右
  manualPlace(dataByName["アメリカ"], xScale(6) + charW, yScale(50), 0); // 線のない45-49歳・50%あたりから1文字右

  // ホバー
  const root = document.querySelector(".workforce-chart");
  const tooltip = document.createElement("div");
  tooltip.className = "wf-tooltip";
  root.appendChild(tooltip);

  function setActive(idx){
    lineEls.forEach((l, i) => {
      l.style.opacity = (idx === null || i === idx) ? 1 : .15;
      l.style.strokeWidth = (i === idx) ? "5px" : "3px";
    });
    labelEls.forEach((l, i) => {
      l.style.opacity = (idx === null || i === idx) ? 1 : .3;
      l.style.fontWeight = (i === idx) ? "700" : "400";
    });
    if (idx !== null) svg.appendChild(lineEls[idx]);
  }

  function nearestAgeIndex(svgX){
    let best = 0, bestDist = Infinity;
    ages.forEach((a, i) => {
      const dist = Math.abs(xScale(i) - svgX);
      if (dist < bestDist){ bestDist = dist; best = i; }
    });
    return best;
  }

  hitEls.forEach((hit, idx) => {
    hit.addEventListener("mouseenter", () => setActive(idx));
    hit.addEventListener("mouseleave", () => { setActive(null); tooltip.style.display = "none"; });
    hit.addEventListener("mousemove", (evt) => {
      const pt = svg.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const i = nearestAgeIndex(p.x);
      const d = data[idx];
      tooltip.innerHTML = `<span class="wf-tt-name">${d.name}</span><br>${ages[i]}歳：${d.values[i]}%`;
      tooltip.style.display = "block";
      const rect = root.getBoundingClientRect();
      tooltip.style.left = (evt.clientX - rect.left + 14) + "px";
      tooltip.style.top = (evt.clientY - rect.top - 10) + "px";
    });
  });

  // 表形式のフォールバック
  const tableDiv = document.getElementById("wf-table");
  let html = "<table><thead><tr><th>国</th>" + ages.map(a => `<th>${a}</th>`).join("") + "</tr></thead><tbody>";
  data.forEach(d => {
    html += "<tr><td>" + d.name + "</td>" + d.values.map(v => `<td>${v}</td>`).join("") + "</tr>";
  });
  html += "</tbody></table>";
  tableDiv.innerHTML = html;
})();
</script>
