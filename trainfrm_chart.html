<!-- 企業特殊訓練：訓練費用と便益を労働者と企業がシェアするときの賃金（労働の限界収入との関係）の概念図。
     数値データに基づく図ではなく、w1 < w'1 < w0 < w'2 < w2 の関係を示すイメージ図。
     ベタ塗り＝労働者が負担・受け取る分、斜線＝企業が負担・受け取る分。
     赤＝訓練費用、青＝訓練の便益。

<div class="viz-root hc-diagram trainfrm-chart">
<style>
.hc-diagram{
  --surface-1:      #fcfcfb;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --grid-line:      #e1e0d9;
  --axis-line:      #6b6a65;
  --guide-line:     #898781;
  --wage-line:      #2b2b2b;
  --cost:           #e03131;
  --benefit:        #1971c2;
  font-family: "Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif;
  color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--grid-line);
  border-radius: 4px;
  padding: 16px 18px 12px;
  margin: 20px auto 10px;
  max-width: 680px;
}
.hc-diagram svg{ width: 100%; height: auto; display: block; overflow: visible; }
.hc-diagram .hd-axis{ stroke: var(--axis-line); stroke-width: 1.6; fill: none; }
.hc-diagram .hd-arrow{ fill: var(--axis-line); }
.hc-diagram .hd-guide{ stroke: var(--guide-line); stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
.hc-diagram .hd-wage{ stroke: var(--wage-line); stroke-width: 3.5; fill: none; stroke-linejoin: round; }
.hc-diagram .hd-text{ font-size: 16px; fill: var(--text-secondary); }
.hc-diagram .hd-math{ font-family: "Times New Roman","Noto Serif JP",serif; font-style: italic; font-size: 19px; fill: var(--text-primary); }
.hc-diagram .hd-math tspan{ font-size: 13px; }
.hc-diagram .hd-legend{
  display: flex; gap: 8px 22px; flex-wrap: wrap;
  font-size: 1rem; color: var(--text-secondary); margin-top: 8px;
}
.hc-diagram .hd-legend span{ display: inline-flex; align-items: center; gap: 7px; }
.hc-diagram .hd-legend svg{ width: 15px; height: 15px; flex: none; }
</style>

<svg viewBox="0 0 560 330" role="img" aria-label="縦軸は賃金と労働の限界収入、横軸は勤続年数。訓練期間中の労働の限界収入はw1だが、費用をシェアするため実際の賃金はw1とw0の間のw1ダッシュになる。訓練後の限界収入はw2だが、便益をシェアするため実際の賃金はw0とw2の間のw2ダッシュになる。">
  <defs>

  <rect x="100" y="165" width="170" height="45" fill="var(--cost)" fill-opacity=".38"/>

</svg>

<div class="hd-legend">

  <span><svg viewBox="0 0 15 15"><rect x=".5" y=".5" width="14" height="14" fill="url(#tf-hatch-cost)" stroke="#e03131"/></svg>企業が負担する訓練費用</span>
  <span><svg viewBox="0 0 15 15"><rect width="15" height="15" rx="2" fill="#1971c2" fill-opacity=".38"/></svg>労働者が受け取る訓練の便益</span>
  <span><svg viewBox="0 0 15 15"><rect x=".5" y=".5" width="14" height="14" fill="url(#tf-hatch-benefit)" stroke="#1971c2"/></svg>企業が受け取る訓練の便益</span>
</div>
</div>
