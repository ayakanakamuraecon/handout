<!-- 週労働時間の国際比較（折れ線グラフ）。データ出典：労働政策研究・研修機構『データブック国際労働比較2024』表6-2 -->
<div class="viz-root workhour-chart">
<style>
.workhour-chart{
  --surface-1:      #fcfcfb;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid-line:      #e1e0d9;
  --axis-line:      #c3c2b7;
  font-family: "Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif;
  color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--grid-line);
  border-radius: 4px;
  padding: 16px 18px 10px;
  margin: 20px 0 10px;
  position: relative;
}
.workhour-chart svg{
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}
.workhour-chart .wc-line{
  fill: none;
  stroke-width: 3px;
  transition: opacity .15s, stroke-width .15s;
}
.workhour-chart .wc-hit{
  fill: none;
  stroke: transparent;
  stroke-width: 16px;
  cursor: pointer;
}
.workhour-chart .wc-dot{
  transition: opacity .15s;
}
.workhour-chart .wc-label{
  font-size: 17px;
  fill: var(--text-secondary);
  transition: opacity .15s, font-weight .15s;
}
.workhour-chart .wc-leader{
  stroke: var(--text-muted);
  stroke-width: 1px;
  stroke-dasharray: 2 2;
}
.workhour-chart .wc-axis-text{
  font-size: 18px;
  fill: var(--text-muted);
}
.workhour-chart .wc-grid{
  stroke: var(--grid-line);
  stroke-width: 1px;
}
.workhour-chart .wc-axis{
  stroke: var(--axis-line);
  stroke-width: 1px;
}
.workhour-chart .wc-tooltip{
  position: absolute;
  pointer-events: none;
  background: #fff;
  border: 1px solid var(--grid-line);
  border-radius: 3px;
  padding: 8px 12px;
  font-size: .95rem;
  line-height: 1.5;
  box-shadow: 0 2px 6px rgba(11,11,11,.12);
  display: none;
  z-index: 5;
  white-space: nowrap;
}
.workhour-chart .wc-tooltip .wc-tt-name{ font-weight: 700; }
.workhour-chart .wc-caption{
  font-size: .78rem;
  color: var(--text-muted);
  text-align: right;
  margin-top: 2px;
}
.workhour-chart details{
  margin-top: 10px;
  font-size: .85rem;
}
.workhour-chart table{
  width: 100%;
  border-collapse: collapse;
  font-size: .78rem;
  margin-top: 6px;
}
.workhour-chart th, .workhour-chart td{
  border: 1px solid var(--grid-line);
  padding: 3px 6px;
  text-align: right;
}
.workhour-chart th:first-child, .workhour-chart td:first-child{
  text-align: left;
}
</style>

<svg id="wc-svg" viewBox="0 0 860 560" role="img" aria-label="週労働時間の推移（国際比較）折れ線グラフ"></svg>

<div class="wc-caption">出典：労働政策研究・研修機構『データブック国際労働比較2024』表6-2のデータをもとに筆者作成</div>

<details>
<summary>データを表で見る</summary>
<div id="wc-table"></div>
</details>

</div>

<script>
(function(){
  const years = [2010,2015,2018,2019,2020,2021,2022];

  // 色は西側諸国=青系、アジア大洋州=橙系のグラデーション。
  // 日本は地理的にアジアのため、青系ではなく単独の暖色（赤）にして目立たせている。
  // 本文で繰り返し対比される「韓国」はアジア系統でもっとも濃い色にしている。
  const westRamp = ["#0d366b","#1c5cab","#3987e5","#86b6ef"];
  const asiaRamp  = ["#7c2d12","#c2410c","#ea580c","#fb923c","#fdba74"];

  const data = [
    {name:"日本",         region:"west", color:"#e34948", values:[40.3,39.0,38.1,37.8,36.6,36.6,36.8]},
    {name:"アメリカ",     region:"west", ramp:0, values:[37.5,37.9,38.2,38.3,37.7,38.1,38.0]},
    {name:"ドイツ",       region:"west", ramp:1, values:[35.8,35.9,35.2,35.1,34.2,34.4,34.2]},
    {name:"スウェーデン", region:"west", ramp:2, values:[36.3,35.8,35.9,35.6,34.9,35.2,35.3]},
    {name:"オランダ",     region:"west", ramp:3, values:[32.0,32.1,32.2,32.2,31.7,31.3,31.6]},
    {name:"韓国",         region:"asia", ramp:0, values:[45.4,43.9,41.8,41.0,39.9,39.2,38.6]},
    {name:"中国",         region:"asia", ramp:1, values:[47.0,45.5,46.5,46.8,47.0,47.6,null]},
    {name:"シンガポール", region:"asia", ramp:2, values:[null,null,44.2,44.7,42.6,44.4,44.3]},
    {name:"タイ",         region:"asia", ramp:3, values:[45.5,43.3,42.9,42.7,41.4,41.4,42.3]},
    {name:"オーストラリア", region:"asia", ramp:4, values:[34.2,33.9,33.2,32.9,31.5,32.9,32.6]}
  ];

  const margin = {left:44, right:185, top:20, bottom:36};
  const width = 860, height = 560;
  const plotW = width - margin.left - margin.right;
  const plotH = height - margin.top - margin.bottom;
  const yMin = 30, yMax = 50;

  function xScale(year){
    return margin.left + (year - years[0]) / (years[years.length-1] - years[0]) * plotW;
  }
  function yScale(v){
    return margin.top + (yMax - v) / (yMax - yMin) * plotH;
  }
  function colorOf(d){
    if (d.color) return d.color;
    return (d.region === "west" ? westRamp : asiaRamp)[d.ramp];
  }
  function lastValid(d){
    for (let i = years.length - 1; i >= 0; i--){
      if (d.values[i] != null) return {i, year: years[i], v: d.values[i]};
    }
    return null;
  }

  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("wc-svg");
  function el(tag, attrs){
    const e = document.createElementNS(svgns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // グリッド・軸（y: 30,35,40,45,50 / x: 各年）
  for (let v = yMin; v <= yMax; v += 5){
    const y = yScale(v);
    svg.appendChild(el("line", {class:"wc-grid", x1:margin.left, x2:width-margin.right, y1:y, y2:y}));
    const t = el("text", {class:"wc-axis-text", x:margin.left-8, y:y+4, "text-anchor":"end"});
    t.textContent = v;
    svg.appendChild(t);
  }
  svg.appendChild(el("line", {class:"wc-axis", x1:margin.left, x2:margin.left, y1:margin.top, y2:height-margin.bottom}));
  years.forEach(yr => {
    const x = xScale(yr);
    const t = el("text", {class:"wc-axis-text", x:x, y:height-margin.bottom+18, "text-anchor":"middle"});
    t.textContent = yr;
    svg.appendChild(t);
  });
  svg.appendChild(el("line", {class:"wc-axis", x1:margin.left, x2:width-margin.right, y1:height-margin.bottom, y2:height-margin.bottom}));

  const xEnd = xScale(years[years.length-1]);

  // ライン描画（欠損値は線を切る）
  const lineEls = [], hitEls = [], labelEls = [];
  const rawLabelY = [];

  data.forEach((d, idx) => {
    const color = colorOf(d);
    let path = "";
    d.values.forEach((v, i) => {
      if (v == null) return;
      const cmd = (i === 0 || d.values[i-1] == null) ? "M" : "L";
      path += `${cmd}${xScale(years[i]).toFixed(1)},${yScale(v).toFixed(1)} `;
    });

    const line = el("path", {class:"wc-line", d:path, stroke:color});
    svg.appendChild(line);
    lineEls.push(line);

    d.values.forEach((v, i) => {
      if (v == null) return;
      svg.appendChild(el("circle", {class:"wc-dot", cx:xScale(years[i]), cy:yScale(v), r:3.6, fill:color, "data-idx":idx}));
    });

    const hit = el("path", {class:"wc-hit", d:path, "data-idx":idx});
    svg.appendChild(hit);
    hitEls.push(hit);

    const lv = lastValid(d);
    rawLabelY.push({idx, y: yScale(lv.v), lastX: xScale(lv.year), lastYear: lv.year});
  });

  // 右端ラベルの縦位置の重なりを解消（上から順に最小間隔を確保）
  const minGap = 19;
  const sorted = rawLabelY.slice().sort((a,b) => a.y - b.y);
  let prevY = -Infinity;
  sorted.forEach(o => {
    let y = Math.max(o.y, prevY + minGap);
    o.labelY = y;
    prevY = y;
  });
  const labelYByIdx = {};
  sorted.forEach(o => labelYByIdx[o.idx] = o);

  data.forEach((d, idx) => {
    const o = labelYByIdx[idx];
    const color = colorOf(d);
    if (o.lastX < xEnd - 2){
      svg.appendChild(el("line", {class:"wc-leader", x1:o.lastX, x2:xEnd+4, y1:o.y, y2:o.labelY}));
    }
    const label = el("text", {class:"wc-label", x:xEnd+8, y:o.labelY+5, "data-idx":idx});
    label.textContent = d.name + (o.lastYear !== years[years.length-1] ? "（" + o.lastYear + "年）" : "");
    label.style.fill = color;
    svg.appendChild(label);
    labelEls.push(label);
  });

  // ホバー：対象の線を強調、他は淡くする＋ツールチップ表示
  const root = document.querySelector(".workhour-chart");
  const tooltip = document.createElement("div");
  tooltip.className = "wc-tooltip";
  root.appendChild(tooltip);

  function setActive(idx){
    lineEls.forEach((l, i) => {
      l.style.opacity = (idx === null || i === idx) ? 1 : .15;
      l.style.strokeWidth = (i === idx) ? "5px" : "3px";
    });
    labelEls.forEach((l, i) => {
      l.style.opacity = (idx === null || i === idx) ? 1 : .3;
      l.style.fontWeight = (i === idx) ? "700" : "400";
    });
    if (idx !== null) svg.appendChild(lineEls[idx]); // 前面に
  }

  function nearestYearIndex(idx, svgX){
    const d = data[idx];
    let best = 0, bestDist = Infinity;
    years.forEach((yr, i) => {
      if (d.values[i] == null) return;
      const dist = Math.abs(xScale(yr) - svgX);
      if (dist < bestDist){ bestDist = dist; best = i; }
    });
    return best;
  }

  hitEls.forEach((hit, idx) => {
    hit.addEventListener("mouseenter", () => setActive(idx));
    hit.addEventListener("mouseleave", () => { setActive(null); tooltip.style.display = "none"; });
    hit.addEventListener("mousemove", (evt) => {
      const pt = svg.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const i = nearestYearIndex(idx, p.x);
      const d = data[idx];
      tooltip.innerHTML = `<span class="wc-tt-name">${d.name}</span><br>${years[i]}年：${d.values[i]}時間/週`;
      tooltip.style.display = "block";
      const rect = root.getBoundingClientRect();
      tooltip.style.left = (evt.clientX - rect.left + 14) + "px";
      tooltip.style.top = (evt.clientY - rect.top - 10) + "px";
    });
  });

  // 表形式のフォールバック
  const tableDiv = document.getElementById("wc-table");
  let html = "<table><thead><tr><th>国</th>" + years.map(y => `<th>${y}</th>`).join("") + "</tr></thead><tbody>";
  data.forEach(d => {
    html += "<tr><td>" + d.name + "</td>" + d.values.map(v => `<td>${v == null ? "－" : v}</td>`).join("") + "</tr>";
  });
  html += "</tbody></table>";
  tableDiv.innerHTML = html;
})();
</script>
